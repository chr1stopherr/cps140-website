    <form name="myform" class="formStyle">
      <div class="inputRow">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
    
      <div class="inputRow">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
    
      <div class="inputRow">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
    
      <div class="inputRow">
        <label for="concern">Concern/Message:</label>
        <input type="text" id="concern" name="concern" required>
      </div>
    
      <div class="inputRow">
        <input type="submit" name="submit" onclick="formSubmission()">
        <script>
          function formSubmission() {
            const myform ="this is a string"
            console.log(myform)
            const name =document.getElementById("name").value
            console.log(name);
            alert("Thank you for submitting " + name);
          }
        </script>
      </div>
      <label>
        Light Mode
        <input type="checkbox" onchange="togglelightMode()">
      </label>
      <script>
        let lightMode = false;
  
        function togglelightMode() {
          console.log("Light mode initially is" + lightMode)
          if (lightMode == true) {
            // Turn off light mode
            lightMode = false;
            document.body.style["backgroundColor"] = "#000000";
            document.body.style["color"] = "#FFFFFF"
          } else {
            // Turn on light mode
            lightMode = true;
            document.body.style["backgroundColor"] = "#FFFFFF";
            document.body.style["color"] = "#000000"
          }
          console.log("Light mode has been changed to" + lightMode)
        }
      </script>
    </form>
