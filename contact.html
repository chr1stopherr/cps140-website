    <form name="myform" class="formStyle">
      <div class="inputRow">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
    
      <div class="inputRow">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
    
      <div class="inputRow">
        <label for="concern">Concern/Message:</label>
        <input type="text" id="concern" name="concern" required>
      </div>
    
      <div class="inputRow">
        <input type="submit" name="submit" onclick="formSubmission()">
        <script>
          function formSubmission() {
            const myform ="this is a string"
            console.log(myform)
            const name =document.getElementById("name").value
            console.log(name);
            alert("Thank you for submitting " + name);
          }
        </script>
